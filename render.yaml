# Render Blueprint — deploys Closing Brackets as a static site.
# The Next.js build (`output: "export"`) writes fully static HTML/CSS/JS to ./out.
services:
  - type: web
    name: closing-brackets
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./out
    previews:
      generation: automatic
    # Declaring the apex domain here means Render will request/attach it (and
    # the auto-added www. redirect) on every Blueprint sync, instead of only
    # existing as a dashboard click. DNS still has to be created manually at
    # the registrar — see the deployment walkthrough.
    domains:
      - closingbrackets.com
    envVars:
      - key: NODE_VERSION
        value: "22.23.1"
      - key: NODE_ENV
        value: production
      # Optional: paste your Microsoft Clarity project ID to enable analytics.
      # Leave blank to ship with no analytics script. Configured in the Render
      # dashboard so it is inlined at build time (NEXT_PUBLIC_* is build-time).
      - key: NEXT_PUBLIC_CLARITY_ID
        sync: false
      # Web3Forms access key for the contact/CTA lead forms. The key is
      # designed to be public (it only routes submissions to your inbox), so
      # inlining it at build time is safe. Get one free at web3forms.com.
      - key: NEXT_PUBLIC_WEB3FORMS_KEY
        sync: false
    # 301 redirects from the pre-redesign URLs. Render only applies a rule
    # when no file exists at the source path; the old route dirs are deleted,
    # so every rule fires. Both bare and trailing-slash sources are listed
    # because the old site was indexed with trailingSlash: true.
    #
    # Only / and /contact/ exist today. A redirect that lands on a 404 throws
    # away the old URL's link equity, so every content-ish source goes to /
    # for now; retarget to /services/, /work/, /about/ etc. when those ship.
    routes:
      - { type: redirect, source: /solution/, destination: / }
      - { type: redirect, source: /solution, destination: / }
      - { type: redirect, source: /service/, destination: / }
      - { type: redirect, source: /service, destination: / }
      - { type: redirect, source: /case-studies-single/, destination: / }
      - { type: redirect, source: /case-studies-single, destination: / }
      - { type: redirect, source: /case-studies/, destination: / }
      - { type: redirect, source: /case-studies, destination: / }
      - { type: redirect, source: /how-it-work/, destination: / }
      - { type: redirect, source: /how-it-work, destination: / }
      - { type: redirect, source: /patent/, destination: / }
      - { type: redirect, source: /patent, destination: / }
      - { type: redirect, source: /story/, destination: / }
      - { type: redirect, source: /story, destination: / }
      - { type: redirect, source: /team/, destination: / }
      - { type: redirect, source: /team, destination: / }
      - { type: redirect, source: /media-kit/, destination: / }
      - { type: redirect, source: /media-kit, destination: / }
      - { type: redirect, source: /documentation/, destination: / }
      - { type: redirect, source: /documentation, destination: / }
      - { type: redirect, source: /blog-single/, destination: / }
      - { type: redirect, source: /blog-single, destination: / }
      - { type: redirect, source: /sign-in/, destination: /contact/ }
      - { type: redirect, source: /sign-in, destination: /contact/ }
      - { type: redirect, source: /sign-up/, destination: /contact/ }
      - { type: redirect, source: /sign-up, destination: /contact/ }
      - { type: redirect, source: /not-found/, destination: / }
      - { type: redirect, source: /not-found, destination: / }
      # Interim-site routes: the old redirect *destinations*, themselves dead.
      # No /* catch-all on purpose — mass-redirecting unknown URLs to / reads
      # as soft-404s and erases the real 404 page.
      - { type: redirect, source: /services/, destination: / }
      - { type: redirect, source: /services, destination: / }
      - { type: redirect, source: /work/, destination: / }
      - { type: redirect, source: /work, destination: / }
      - { type: redirect, source: /process/, destination: / }
      - { type: redirect, source: /process, destination: / }
      - { type: redirect, source: /about/, destination: / }
      - { type: redirect, source: /about, destination: / }
      - { type: redirect, source: /blog/, destination: / }
      - { type: redirect, source: /blog, destination: / }
    # Security + caching headers for a strong Lighthouse "Best Practices" score.
    headers:
      # Render already force-redirects http -> https on custom domains, so HSTS
      # is safe to turn on. Starts at 180 days with no includeSubDomains/preload
      # so a future subdomain (e.g. a mail or app host) can't get locked into
      # HTTPS-only by accident; raise max-age once the domain has been stable
      # on Render for a while.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=15552000
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # Hashed build assets are immutable — cache them for a year.
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Scroll-world camera clips (~110 MB across the chain). Repeat visitors
      # should never re-download these, but the filenames carry no content hash
      # and any clip can be re-rendered, so this is deliberately NOT immutable —
      # a year-long immutable cache would pin a stale clip in every browser that
      # ever loaded it. 30 days covers realistic repeat visits and still lets a
      # re-render propagate. If these ever need `immutable`, move them under a
      # versioned path (/assets/v2/...) rather than lengthening this.
      - path: /assets/vid/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=2592000
      # The topbar logo is referenced by URL from CSS (not content-hashed). Same
      # 30-day / not-immutable reasoning as /assets/* — rename the file if it
      # ever needs to change instantly.
      - path: /logo-mark.svg
        name: Cache-Control
        value: public, max-age=2592000
      # NOTE: public/serve.json mirrors these Cache-Control rules for the local
      # `pnpm serve` preview so local Lighthouse runs match production headers.
      # Keep the two in sync when editing cache lifetimes.
