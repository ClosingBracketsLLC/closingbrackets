<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon variant of the Interlock Monogram: ink tile so it reads on any
       tab colour, no glow (a halo turns to mud at 16px). Four plain rects,
       all coordinates even numbers so every edge lands on a whole pixel when
       rendered at 16x16. EDITS HERE MUST BE MIRRORED in
       scripts/brand/make-icons.py GEOMETRY. -->
  <rect width="32" height="32" rx="6" fill="#060910"/>
  <g fill="#2EF2DC">
    <rect x="6" y="6" width="20" height="4"/>
    <rect x="22" y="6" width="4" height="20"/>
    <rect x="6" y="22" width="20" height="4"/>
  </g>
  <rect x="6" y="12" width="8" height="8" fill="#FF4E64"/>
</svg>
